version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

# Docker updater intentionally absent on main: no Dockerfile/Kubernetes manifest
# is tracked at /. Re-enable for the actual Dockerfile directory when merged.
