services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: crip_wallet
      POSTGRES_PASSWORD: ${CRIP_POSTGRES_PASSWORD:?generated by npm run dev:up}
      POSTGRES_USER: crip
    ports:
      - "127.0.0.1:${CRIP_POSTGRES_PORT:-0}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crip -d crip_wallet"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - local-only

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46
    entrypoint: ["anvil"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "31337"
      - --accounts
      - "3"
      - --balance
      - "10000"
      - --mnemonic-seed-unsafe
      - "31337"
      - --config-out
      - /tmp/anvil.json
      - --state
      - /var/lib/anvil/state.json
      - --quiet
    user: "${CRIP_LOCAL_UID:?generated by npm run dev:up}:${CRIP_LOCAL_GID:?generated by npm run dev:up}"
    volumes:
      - ./.local/anvil-state:/var/lib/anvil
    healthcheck:
      test:
        [
          "CMD",
          "cast",
          "rpc",
          "--rpc-url",
          "http://127.0.0.1:8545",
          "eth_chainId",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - anvil-private

  anvil-gateway:
    build:
      context: ./adapters/local-anvil
      dockerfile: Dockerfile.gateway
    environment:
      ANVIL_RPC_UPSTREAM: http://anvil:8545
      ANVIL_MUTATION_LOCK_FILE: /run/crip/anvil.lock
      ANVIL_STATE_FILE: /var/lib/anvil/state.json
      ANVIL_POISON_FILE: /run/crip/anvil.poisoned
      PORT: "8545"
    ports:
      - "127.0.0.1:${CRIP_ANVIL_PORT:-0}:8545"
    user: "${CRIP_LOCAL_UID:?generated by npm run dev:up}:${CRIP_LOCAL_GID:?generated by npm run dev:up}"
    volumes:
      - ./.local/coordination:/run/crip
      - ./.local/anvil-state:/var/lib/anvil
    depends_on:
      anvil:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "-e",
          "fetch('http://127.0.0.1:8545/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - anvil-private
      - gateway-host

networks:
  local-only:
    driver: bridge
  gateway-host:
    driver: bridge
  anvil-private:
    driver: bridge
    internal: true

volumes:
  postgres-data:
