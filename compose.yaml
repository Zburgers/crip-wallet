services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: crip_wallet
      POSTGRES_PASSWORD: ${CRIP_POSTGRES_PASSWORD:?generated by npm run dev:up}
      POSTGRES_USER: crip
    ports:
      - "127.0.0.1:${CRIP_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crip -d crip_wallet"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - local-only

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46
    entrypoint: ["anvil"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "31337"
      - --accounts
      - "3"
      - --balance
      - "10000"
      - --mnemonic-seed-unsafe
      - "31337"
      - --config-out
      - /tmp/anvil.json
      - --quiet
    ports:
      - "127.0.0.1:${CRIP_ANVIL_PORT:-8545}:8545"
    healthcheck:
      test:
        [
          "CMD",
          "cast",
          "rpc",
          "--rpc-url",
          "http://127.0.0.1:8545",
          "eth_chainId",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - local-only

networks:
  local-only:
    driver: bridge

volumes:
  postgres-data:
